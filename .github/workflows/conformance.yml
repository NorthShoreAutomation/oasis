name: conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r tests/conformance/requirements-lock.txt
      # The public tree does not contain test_prerequisites.py or
      # test_historical.py. Discovery runs the tests that are present.
      - run: python -W error -m unittest discover -s tests/conformance -t . -p 'test_*.py'
